<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIチューター デモ</title>
<style>
    :root {
        --primary-color: #4A90E2;
        --bg-color: #f5f5f5;
        --text-color: #333;
        --border-radius: 8px;
        --chat-student-bg: #4A90E2;
        --chat-ai-bg: #e0e0e0;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        -webkit-font-smoothing: antialiased;
    }

    /* --- ナビゲーションタブ（実アプリと同一） --- */
    .tab-bar {
        display: flex;
        background: #fff;
        padding: 10px;
        border-bottom: 1px solid #ddd;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 100;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        padding-top: env(safe-area-inset-top, 10px);
    }
    .tab-btn {
        flex: 1;
        padding: 12px 5px;
        border: 1px solid #ddd;
        background: #fff;
        cursor: pointer;
        text-align: center;
        font-weight: bold;
        color: #666;
        font-size: 14px;
        transition: all 0.2s;
    }
    .tab-btn:first-child { border-radius: 8px 0 0 8px; }
    .tab-btn:last-child { border-radius: 0 8px 8px 0; }
    .tab-btn.active {
        background-color: var(--primary-color);
        color: #fff;
        border-color: var(--primary-color);
    }

    /* --- メインコンテンツ --- */
    .container {
        max-width: 600px;
        margin: 0 auto 20px;
        padding: 0 15px;
        padding-top: 80px;
    }
    .section {
        background: #fff;
        border: 1px solid #ccc;
        border-radius: var(--border-radius);
        padding: 15px;
        margin-bottom: 20px;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
    }
    h2, h3 {
        margin-top: 0;
        font-size: 1.1em;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
        margin-bottom: 15px;
        color: #444;
    }
    input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
        appearance: none;
        font-family: inherit;
    }

    /* --- チャット画面（実アプリと同一） --- */
    .chat-container {
        height: calc(100vh - 300px);
        min-height: 320px;
        overflow-y: auto;
        border: 1px solid #eee;
        padding: 15px;
        background: #fafafa;
        border-radius: 4px;
        margin-bottom: 15px;
    }
    .message { margin-bottom: 15px; display: flex; align-items: flex-end; }
    .message.ai { justify-content: flex-start; }
    .message.student { justify-content: flex-end; }

    .submit-english-btn {
        margin-top: 4px;
        padding: 3px 12px;
        font-size: 0.78em;
        border: 1px solid var(--primary-color);
        background: #fff;
        color: var(--primary-color);
        border-radius: 12px;
        cursor: pointer;
        white-space: nowrap;
    }
    .submit-english-btn:hover { background: var(--primary-color); color: #fff; }
    .submit-english-btn[data-done="1"] {
        background: #e8f5e9; color: #2e7d32; border-color: #2e7d32; cursor: default;
    }
    .submit-english-btn[data-done="1"]:hover { background: #e8f5e9; color: #2e7d32; }

    .bubble {
        max-width: 78%;
        padding: 10px 15px;
        border-radius: 18px;
        font-size: 0.95em;
        line-height: 1.5;
        position: relative;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        white-space: pre-wrap;
    }
    .ai .bubble { background: var(--chat-ai-bg); color: #333; border-bottom-left-radius: 4px; }
    .student .bubble { background: var(--chat-student-bg); color: #fff; border-bottom-right-radius: 4px; }

    .md { white-space: normal; }
    .md ul { margin: 6px 0 2px; padding-left: 1.3em; }
    .md li { margin: 2px 0; }
    .md strong { font-weight: 700; }
    .meta-tag {
        display: inline-block;
        font-size: 0.72em;
        font-weight: bold;
        color: #7a4fb5;
        background: #f1e9fb;
        border: 1px solid #d9c4f2;
        border-radius: 4px;
        padding: 1px 6px;
        margin-bottom: 5px;
    }

    .typing-indicator span {
        display: inline-block;
        width: 6px;
        height: 6px;
        background-color: #888;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out both;
        margin: 0 2px;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }

    .view { display: none; }
    .view.active { display: block; }

    /* --- ログイン画面（実アプリと同一の見た目） --- */
    .login-container {
        max-width: 400px;
        margin: 0 auto;
        padding: 34px 30px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .login-title {
        text-align: center;
        font-size: 1.5em;
        margin-bottom: 14px;
        color: var(--primary-color);
    }
    .login-btn {
        width: 100%;
        padding: 12px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1em;
        font-weight: bold;
        cursor: pointer;
        margin-top: 15px;
        font-family: inherit;
    }
    .login-btn:hover { background: #3a7bc8; }

    #login-view {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 15px;
    }

    .toast {
        position: fixed;
        left: 50%; bottom: 24px;
        transform: translateX(-50%) translateY(10px);
        background: #333; color: #fff;
        padding: 9px 16px; border-radius: 20px;
        font-size: 0.82em;
        opacity: 0; pointer-events: none;
        transition: opacity .2s ease, transform .2s ease;
        z-index: 999;
        white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ============ ログイン画面（デモ入口） ============ -->
<div id="login-view">
    <div class="login-container">
        <h1 class="login-title">AIチューター</h1>
        <div style="font-size:0.85em; color:#888; text-align:center; margin-bottom:18px; line-height:1.7;">
            書いて、直して、もう一度書く。<br>AIと進める英作文コーチング
        </div>
        <div style="font-size:0.78em; color:#888; background:#f5f5f5; border-radius:6px; padding:10px 12px; line-height:1.7;">
            これは教育工学会ポスター発表用のデモです。生成AIの呼び出しは行わず、実際の授業でのやり取りをもとにした例を表示します。
        </div>
        <button class="login-btn" onclick="enterApp()">デモを見る</button>
    </div>
</div>

<!-- ============ メインアプリ（ログイン後） ============ -->
<div id="app-container" style="display:none;">
    <nav class="tab-bar">
        <div class="tab-btn" onclick="showToast('デモではチャット画面のみご覧いただけます')">ホーム</div>
        <div class="tab-btn active">質問チャット</div>
        <div class="tab-btn" onclick="showToast('デモではチャット画面のみご覧いただけます')">授業の振り返り</div>
    </nav>

    <main class="container">
        <section class="section">
            <h3>質問チャット <span style="font-size:0.8em; font-weight:normal; margin-left:10px; color:#666;">(昨日の出来事について)</span></h3>
            <div style="font-size:0.8em; color:#888; margin:-8px 0 12px;">
                ※ メタ認知プロンプトを含む条件（B群）での、実際のやり取りをもとにした一例です
            </div>

            <div class="chat-container" id="chat-container">
                <div class="message ai">
                    <div class="bubble">こんにちは!今日の授業でわからないことはありますか?</div>
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <input type="text" id="chat-input" placeholder="質問を入力…" onkeydown="if(event.key==='Enter'){event.preventDefault();onSend();}">
                <button id="send-btn" onclick="onSend()" style="padding:0 20px; border-radius:4px; border:none; background:var(--primary-color); color:#fff; font-weight:bold; cursor:pointer; white-space:nowrap;">送信</button>
            </div>
        </section>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
    const container = document.getElementById('chat-container');

    function el(html){
        const t = document.createElement('template');
        t.innerHTML = html.trim();
        return t.content.firstElementChild;
    }
    function scrollDown(){ container.scrollTop = container.scrollHeight; }

    function addAI(html, metaTag){
        const tag = metaTag ? `<span class="meta-tag">${metaTag}</span><br>` : '';
        container.appendChild(el(`<div class="message ai"><div class="bubble md">${tag}${html}</div></div>`));
        scrollDown();
    }
    function addStudent(text, withSubmit){
        const row = el(`<div class="message student" style="flex-direction:column; align-items:flex-end;"><div class="bubble"></div></div>`);
        row.querySelector('.bubble').textContent = text;
        if (withSubmit){
            const btn = document.createElement('button');
            btn.className = 'submit-english-btn';
            btn.textContent = 'この英文を提出';
            btn.style.marginTop = '4px';
            btn.onclick = function(){
                if (btn.dataset.done) return;
                btn.dataset.done = '1';
                btn.textContent = '✓ 提出しました';
                addSystemNote('振り返りに記録しました');
            };
            row.appendChild(btn);
        }
        container.appendChild(row);
        scrollDown();
    }
    function addSystemNote(text){
        container.appendChild(el(`<div style="text-align:center; font-size:0.72em; color:#999; margin:2px 0 6px;">${text}</div>`));
        scrollDown();
    }
    function showTyping(){
        const t = el(`<div class="message ai"><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div>`);
        container.appendChild(t);
        scrollDown();
        return t;
    }

    // --- あらかじめ用意した一連のやり取り ---------------------------------
    // メタ認知プロンプト（計画・監視・評価）の文言は、実際にアプリが
    // 提示するものと同一。それ以外のAIの発言（英文へのやり取り）は
    // 会話の流れを見せるための一例。
    const script = [
        () => addStudent('昨日の英語の授業で、友達と勉強したことを書こうと思います。'),
        () => addAI('何を一番伝えたいか、どの順で書くかを考えよう', '計画'),
        () => addAI('いいですね!では、その内容を英語にしてみましょう。書けたら送ってください。'),
        () => addStudent('I go to school yesterday. I study English with my friend. It was fun day.'),
        () => addAI('書いた英文が伝えたい内容に合っているか確認しよう', '監視'),
        () => addStudent('"go" が変な気がします…"went" かな?'),
        () => addAI(
            '<strong>その通りです!</strong> goをwentに直しましょう。' +
            '<ul><li>"It was fun day" → funの前に <strong>a</strong> が必要です(a fun day)</li></ul>' +
            'この2つを直して、もう一度書いてみてください。'
        ),
        () => addStudent('I went to school yesterday. I studied English with my friend. It was a fun day.', true),
        () => addAI('最初に伝えたかったことが書けたか、次に直したい点はあるか考えよう', '評価'),
        () => addStudent('最初に伝えたかった、友達と勉強したことは書けました。次は時制のミスに気をつけたいです。'),
        () => addAI('<strong>いいですね。</strong> その意識を次の英作文でも忘れずに。今日はお疲れさまでした!'),
    ];

    function playScript(i){
        if (i >= script.length) return;
        const isAI = script[i].toString().includes('addAI');
        if (isAI){
            const t = showTyping();
            setTimeout(function(){
                t.remove();
                script[i]();
                setTimeout(() => playScript(i+1), 550);
            }, 700);
        } else {
            script[i]();
            setTimeout(() => playScript(i+1), 500);
        }
    }

    // --- 手入力への応答(デモである旨を伝える固定メッセージ) --------------
    const FALLBACK = '🔒 これはデモです。実際の授業では、入力から局面（計画・監視・評価）を推定し、対応する問いかけを返します。';

    window.onSend = function(){
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        addStudent(text, false);
        input.value = '';
        const t = showTyping();
        setTimeout(function(){
            t.remove();
            addAI(FALLBACK);
        }, 900);
    };

    window.enterApp = function(){
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        if (!container.dataset.built){
            container.dataset.built = '1';
            playScript(0);
        }
    };

    let toastTimer;
    window.showToast = function(msg){
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    };
})();
</script>
</body>
</html>
